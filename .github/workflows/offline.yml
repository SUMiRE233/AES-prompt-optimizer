name: offline-checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python project_checks.py
      - run: python offline_smoke.py
      - run: python -m py_compile *.py

# Remote model/API evaluation is intentionally excluded. It belongs to the
# separately approved Phase 2 protocol and requires a user-owned credential.
